name: image
on:
  push:
    tags: ['v*-starci.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. 2026.10.10-beta.5-starci.1)'
        required: true
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free the runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - id: v
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ver=${TAG%-starci.*}" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          sbom: true
          provenance: mode=max
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            OPENCLAW_BUILD_TIMESTAMP=${{ steps.v.outputs.time }}
            OPENCLAW_DOCKER_BUILD_VERSION=${{ steps.v.outputs.ver }}
          tags: |
            ghcr.io/starci183/openclaw:${{ steps.v.outputs.tag }}
            ghcr.io/starci183/openclaw:latest
